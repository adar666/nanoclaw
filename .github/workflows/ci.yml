name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: pnpm install --frozen-lockfile
      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck host
        run: pnpm exec tsc --noEmit

      - name: Typecheck container
        run: pnpm exec tsc -p container/agent-runner/tsconfig.json --noEmit

      - name: Typecheck eval
        run: pnpm run typecheck:eval

      - name: Host tests
        run: pnpm exec vitest run

      - name: Install LibreOffice (for .doc conversion tests)
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for attempt in 1 2; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer; then
              exit 0
            fi
            echo "apt attempt $attempt failed, retrying..." >&2
            sleep 5
          done
          echo "apt-get install failed after 2 attempts" >&2
          exit 1

      - name: Container tests
        working-directory: container/agent-runner
        # --timeout above bun:test's 5000ms default: a handful of tests
        # (real-timer async completion tests in poll-loop.test.ts, and
        # documents.test.ts's oversized-file boundary test, which now writes
        # real megabyte-scale fixtures) sit close enough to 5000ms on a dev
        # machine that GitHub's shared ubuntu-latest runner — consistently
        # slower, confirmed by 2 identical CI runs failing the exact same 5
        # tests within a few hundred ms of the boundary, never locally —
        # tips them over. Same class of fix as the LibreOffice install step
        # above (this codebase's own established pattern: give CI honestly
        # more time rather than chase a false regression).
        run: bun test --timeout 20000
